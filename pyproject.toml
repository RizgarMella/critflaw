[project]
name = "critflaw"
version = "0.0.1"
description = "Probabilistic engineering critical assessment of flaws in metallic structures (failure assessment diagram methods)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Rizgar Mella" }]
keywords = ["failure assessment diagram", "fracture mechanics", "structural reliability", "fatigue"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/RizgarMella/critflaw"
Documentation = "https://github.com/RizgarMella/critflaw/tree/main/docs/manual"

[project.optional-dependencies]
units = ["pint>=0.23"]
plot = [
    "matplotlib>=3.8",
]
crosscheck = ["openturns>=1.22"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=5",
    "openturns>=1.27.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critflaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:doctest"  # the stored WARP3D outputs in tests/data are named test*.txt

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"examples/**" = ["E501"]  # long explanatory print strings in the worked examples
"tests/oracles/partner_reference_*.py" = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/critflaw"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
